name: ESPDock
options:
  bundleIdPrefix: de.plontsch
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    # App signing follows its Xcode-selected Team below; tests stay ad-hoc.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  ESPDock:
    type: application
    platform: macOS
    sources:
      - ESPDock
      - path: ESPDock/Assets.xcassets/AppIcon.icon
        type: file
        buildPhase: resources
      # Firmware library copied into projects by "Add Version Reporting…"
      - path: FirmwareLib
        type: folder
        buildPhase: resources
    settings:
      base:
        MARKETING_VERSION: "0.2"
        CURRENT_PROJECT_VERSION: "3"
        DEVELOPMENT_TEAM: DNKZNVGEK5
        CODE_SIGN_IDENTITY: Apple Development
        "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Development
        CODE_SIGN_STYLE: Automatic
        PROVISIONING_PROFILE_SPECIFIER: ""
        PRODUCT_BUNDLE_IDENTIFIER: de.plontsch.ESPDock
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ESPDock
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to a paired ESP32 on your local network for read-only logs and firmware identity.
        # No App Sandbox: the app must read IOKit serial devices and (later)
        # run ~/.platformio/penv/bin/pio. Personal tool, not distributed.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
    postBuildScripts:
      - name: Stamp Build Date
        basedOnDependencyAnalysis: false
        # Declared as an *input* (not output) so the phase is ordered after
        # ProcessInfoPlistFile; without it the parallel build ran the stamp
        # first and the date was overwritten.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          # Stamp the build date/time (UTC, ISO 8601) into the built app's Info.plist.
          set -e
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          [ -f "${PLIST}" ] || exit 0
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          /usr/libexec/PlistBuddy -c "Set :BuildDate ${BUILD_DATE}" "${PLIST}" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :BuildDate string ${BUILD_DATE}" "${PLIST}"
  ESPDockTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ESPDockTests
    dependencies:
      - target: ESPDock
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
